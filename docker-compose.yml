version: "3.8"

name: cyber-defense-full-stack

networks:
  telemetry-net:
    driver: bridge

volumes:
  redpanda-data:
  opensearch-data:

services:
  # ==========================================
  # 1. Redpanda Broker (Lightweight Kafka)
  # ==========================================
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.8
    container_name: redpanda-broker
    command:
      - redpanda start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --mode dev-container
      - --smp 1
      - --memory 1G
    ports:
      - "19092:19092"
      - "9644:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    networks:
      - telemetry-net
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # 2. OpenSearch (Telemetry Storage)
  # ==========================================
  opensearch:
    image: opensearchproject/opensearch:2.15.0
    container_name: opensearch-node
    environment:
      - cluster.name=cyber-defense-cluster
      - node.name=os-node
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
      - "DISABLE_INSTALL_DEMO_CONFIG=true"
      - "DISABLE_SECURITY_PLUGIN=true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
    networks:
      - telemetry-net
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q 'green\\|yellow'"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ==========================================
  # 3. OpenSearch Dashboards
  # ==========================================
  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.15.0
    container_name: opensearch-dashboards
    ports:
      - "5601:5601"
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    depends_on:
      opensearch:
        condition: service_healthy
    networks:
      - telemetry-net

  # ==========================================
  # 4. Cyber Defense App (API + Pipeline)
  # ==========================================
  app:
    build: .
    container_name: cyber-defense-app
    environment:
      - CYBERDEF_MODE=full
      - CYBERDEF_KAFKA_BROKERS=redpanda:9092
      - CYBERDEF_OPENSEARCH_HOST=http://opensearch:9200
    ports:
      - "8000:8000"
    depends_on:
      redpanda:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    networks:
      - telemetry-net
    volumes:
      - ./data:/app/data
